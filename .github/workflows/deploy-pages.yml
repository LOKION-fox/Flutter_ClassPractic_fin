name: Test, build and deploy Flutter Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Format source
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web release
        shell: bash
        env:
          POCKETBASE_URL: ${{ vars.POCKETBASE_URL }}
        run: |
          if [[ -z "$POCKETBASE_URL" ]]; then
            echo "::error::Create repository variable POCKETBASE_URL in Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi

          if [[ "$POCKETBASE_URL" != https://* ]]; then
            echo "::error::For GitHub Pages POCKETBASE_URL must use HTTPS. Current value: $POCKETBASE_URL"
            exit 1
          fi

          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          if [[ "$REPO_NAME" == *.github.io ]]; then
            BASE_HREF="/"
          else
            BASE_HREF="/$REPO_NAME/"
          fi

          echo "BASE_HREF=$BASE_HREF"
          echo "POCKETBASE_URL=$POCKETBASE_URL"

          flutter build web --release \
            --base-href "$BASE_HREF" \
            --dart-define=POCKETBASE_URL="$POCKETBASE_URL"

          # Для прямого открытия вложенных маршрутов GitHub Pages.
          cp build/web/index.html build/web/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
